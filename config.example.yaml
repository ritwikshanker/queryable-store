# chatmem configuration.
#
# Copy this file to config.yaml and edit it. config.yaml is gitignored — it may
# name real people and a real database path, config.example.yaml must not.

db_path: data/chatmem.db

# The person whose facts get extracted, as a person id or any alias declared
# below. Every CLI command that needs a target accepts --target to override
# this for a single run.
target: null

# Map raw sender display names to a single person. One person may have
# several accounts across different threads; list every display name they
# have ever used as an alias and they will be merged under one person_id.
# Senders not listed here are auto-created as their own person on ingest
# (chatmem prints a warning with a paste-ready block for each one).
#
# identities:
#   - id: target
#     display_name: Participant A
#     aliases: ["Participant A", "participant.a", "Participant A (new)"]
#   - id: other
#     display_name: Participant B
#     aliases: ["Participant B"]
identities: []

# Any OpenAI-compatible server. LM Studio serves /v1 on port 1234; Ollama on
# port 11434. Point base_url at a host you trust -- see "Using a remote GPU" in
# the README before aiming it anywhere but this machine.
llm:
  base_url: http://localhost:1234/v1
  api_key: lm-studio        # dummy value; neither LM Studio nor Ollama checks it
  chat_model: ""             # set to a chat model id your server actually serves
  embedding_model: ""        # set to an embedding model id your server actually serves
  timeout_seconds: 60
  max_retries: 3
  # Only sent if you set it -- a server that doesn't know the parameter will
  # reject the request outright. On a reasoning model, "none" is a large win:
  # extraction and classification are mechanical, and thinking tokens are pure
  # latency. Measured ~3x faster on qwen3 via Ollama.
  # reasoning_effort: none

sessionize:
  idle_gap_minutes: 120
  max_messages: 40

extraction:
  validation_pass: false
  # A newly extracted statement whose embedding is this similar to one
  # already stored is treated as a restatement and dropped. Set to 0 to keep
  # every statement.
  dedup_threshold: 0.92
